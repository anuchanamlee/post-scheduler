<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body {
      margin: 0; background: #eff1f5; color: #10131a;
      font-family: Sarabun, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    button { font: inherit; cursor: pointer; }
    a { color: #3b3fd8; text-decoration: none; }
    a:hover { color: #2f33bd; }
    .hint { font-size: 12.5px; color: #626a7c; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #eff1f5; position: relative; overflow: hidden; display: flex; flex-direction: column">

  <div style="min-height: 56px; background: #ffffff; border-bottom: 1px solid #dfe3ec; display: flex; align-items: center; gap: 6px; padding: 0 12px; flex: none">
    <button style="width: 44px; height: 44px; border-radius: 6px; border: 1px solid #dfe3ec; background: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#3d4453" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"/></svg>
    </button>
    <span style="font-weight: 700; font-size: 15px; flex-grow: 1; text-align: center">กันยายน 2026</span>
    <button style="width: 44px; height: 44px; border-radius: 6px; border: 1px solid #dfe3ec; background: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#3d4453" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l6 6-6 6"/></svg>
    </button>
  </div>

  <!-- คำอธิบายสถานะ — ของจริงบอกด้วยสีเส้นขอบ 3px อย่างเดียว คนตาบอดสีแยกไม่ออก -->
  <div style="background: #ffffff; border-bottom: 1px solid #dfe3ec; padding: 7px 12px; display: flex; gap: 10px; flex-wrap: wrap; flex: none">
    <sc-for list="{{legend}}" as="l" hint-placeholder-count="4">
      <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: #626a7c">
        <span style="{{l.iconStyle}}"></span>{{l.label}}
      </span>
    </sc-for>
  </div>

  <div style="padding: 10px 12px 0; flex: none">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding-bottom: 5px">
      <sc-for list="{{dows}}" as="d" hint-placeholder-count="7">
        <span style="text-align: center; font-size: 11px; font-weight: 600; color: #626a7c">{{d.t}}</span>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
        <button onClick="{{ c.pick }}" style="{{c.style}}">
          <span class="num" style="font-size: 12.5px; font-weight: {{c.weight}}">{{c.day}}</span>
          <span style="display: flex; gap: 2px; align-items: center; min-height: 12px">
            <sc-for list="{{c.marks}}" as="m" hint-placeholder-count="2">
              <span style="{{m.style}}"></span>
            </sc-for>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: baseline; gap: 8px; padding: 0 2px">
      <span style="font-size: 13px; font-weight: 600; color: #626a7c; flex-grow: 1">{{dayTitle}}</span>
      <span class="num" style="font-size: 12px; color: #626a7c">{{dayCount}}</span>
    </div>

    <sc-for list="{{dayPosts}}" as="p" hint-placeholder-count="3">
      <div style="background: #ffffff; border: 1px solid #dfe3ec; border-left: 3px solid {{p.edge}}; border-radius: 8px; padding: 10px 11px; display: flex; align-items: center; gap: 10px">
        <span style="{{p.iconStyle}}"></span>
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; line-height: 1.35">
          <span class="num" style="font-size: 14px; font-weight: 700">{{p.time}}</span>
          <span style="font-size: 12px; color: #626a7c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.caption}}</span>
        </span>
        <button onClick="{{ p.move }}" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #dfe3ec; background: #ffffff; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; flex: none">
          <span style="{{moveIcon}}"></span>
          เลื่อน
        </button>
      </div>
    </sc-for>

    <div style="height: 8px"></div>
  </div>

  <!-- เลื่อนวันด้วยการแตะ — ของจริงมีแต่ลาก HTML5 drag ซึ่งไม่ทำงานบนจอสัมผัส -->
  <sc-if value="{{moving}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; background: rgba(16, 19, 26, .45); display: flex; align-items: flex-end">
      <div style="width: 100%; background: #ffffff; border-radius: 14px 14px 0 0; padding: 8px 12px 18px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: center; padding: 4px 0 4px">
          <span style="width: 38px; height: 4px; border-radius: 999px; background: #dfe3ec"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 14px; font-weight: 700; flex-grow: 1">เลื่อนไปวันไหน</span>
          <button onClick="{{ closeMove }}" style="width: 44px; height: 44px; border-radius: 6px; border: 1px solid #dfe3ec; background: #ffffff; display: inline-flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#3d4453" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
          </button>
        </div>
        <span class="hint">{{movingWhat}}</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px">
          <sc-for list="{{moveTargets}}" as="t" hint-placeholder-count="6">
            <button onClick="{{ t.pick }}" style="{{t.style}}">
              <span style="font-size: 11.5px; opacity: .8">{{t.when}}</span>
              <span class="num" style="font-size: 13.5px; font-weight: 700">{{t.date}}</span>
            </button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8px; align-items: flex-start; background: #fbf3dd; border: 1px solid #f3d9c2; border-radius: 6px; padding: 9px 10px">
          <span style="{{warnIcon}}"></span>
          <span style="font-size: 12px; color: #8a6a00; line-height: 1.5">เลื่อนไปวันที่ผ่านมาแล้ว ระบบจะบอกทันทีว่าเลยเวลา ไม่ปล่อยให้เงียบ</span>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>

<script data-dc-script data-props='{"openMove":{"editor":"boolean","default":false,"section":"สาธิต"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 10, moving: props.openMove === true ? 0 : null };
  }

  mask(inner, color, size) {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
    const s = size || 14;
    return 'width:' + s + 'px;height:' + s + 'px;flex:none;display:inline-block;background-color:' + color + ';'
      + "-webkit-mask:url('data:image/svg+xml;utf8," + encodeURIComponent(svg) + "') center/contain no-repeat;"
      + "mask:url('data:image/svg+xml;utf8," + encodeURIComponent(svg) + "') center/contain no-repeat;";
  }

  renderVals() {
    const ICONS = {
      posted: '<path d="M4 10.5l4 4 8-9"/>',
      pending: '<circle cx="10" cy="10" r="7"/><path d="M10 6v4.5l3 1.6"/>',
      failed: '<path d="M10 3.5 2.8 16h14.4L10 3.5z"/><path d="M10 8.5v3.2M10 13.8v.1"/>',
      partial: '<circle cx="10" cy="10" r="7"/><path d="M10 3v14"/>',
    };
    const INK = { posted: '#1f7a4d', pending: '#626a7c', failed: '#b42318', partial: '#a8460a' };
    const WORD = { posted: 'ขึ้นแล้ว', pending: 'รอโพสต์', failed: 'ล้มเหลว', partial: 'ขึ้นไม่ครบ' };

    const legend = ['posted', 'pending', 'partial', 'failed'].map((k) => ({
      label: WORD[k],
      iconStyle: this.mask(ICONS[k], INK[k], 13),
    }));

    const dows = ['จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส', 'อา'].map((t) => ({ t }));

    // ตารางเดือน — วันไหนมีโพสต์อะไรบ้าง
    const byDay = {
      2: ['posted'], 3: ['posted', 'posted'], 5: ['failed'],
      8: ['posted', 'partial'], 9: ['pending'],
      10: ['posted', 'partial', 'pending'], 11: ['pending'], 12: ['pending', 'pending'],
      15: ['pending'], 17: ['pending'], 19: ['pending'], 22: ['pending'], 24: ['pending'],
    };

    const cells = [];
    for (let i = 0; i < 35; i++) {
      const day = i - 0; // 1 ก.ย. 2026 = จันทร์ ช่องแรกพอดี
      const d = day + 1;
      const inMonth = d >= 1 && d <= 30;
      const on = d === this.state.day;
      const marks = (byDay[d] || []).slice(0, 3).map((k) => ({
        style: this.mask(ICONS[k], INK[k], 11),
      }));
      cells.push({
        day: inMonth ? String(d) : '',
        weight: on ? '700' : '500',
        marks,
        style: 'min-height:52px;border-radius:7px;padding:5px 2px 4px;display:flex;flex-direction:column;'
          + 'align-items:center;justify-content:space-between;'
          + 'border:1px solid ' + (on ? '#3b3fd8' : '#dfe3ec') + ';'
          + 'background:' + (on ? '#eceffe' : (inMonth ? '#ffffff' : '#f7f8fb')) + ';'
          + 'color:' + (inMonth ? (on ? '#3b3fd8' : '#10131a') : '#b9c0d0') + ';',
        pick: () => this.setState({ day: inMonth ? d : this.state.day }),
      });
    }

    const postsByDay = {
      10: [
        { time: '09:00', status: 'posted', caption: 'เปิดร้านแล้ววันนี้ กาแฟดริปคั่วใหม่' },
        { time: '12:30', status: 'partial', caption: 'เมนูใหม่ ข้าวผัดกุ้ง ฿89' },
        { time: '17:00', status: 'pending', caption: 'ซื้อ 1 แถม 1 เฉพาะเมนูที่ร่วมรายการ' },
      ],
      9: [{ time: '18:00', status: 'pending', caption: 'ปิดร้านเร็ววันนี้' }],
      5: [{ time: '11:00', status: 'failed', caption: 'โปรกลางเดือน' }],
    };

    const list = postsByDay[this.state.day] || [];
    const dayPosts = list.map((p, i) => ({
      time: p.time,
      caption: p.caption,
      edge: INK[p.status],
      iconStyle: this.mask(ICONS[p.status], INK[p.status], 18),
      move: () => this.setState({ moving: i }),
    }));

    const moveTargets = [
      { when: 'พรุ่งนี้', date: '11 ก.ย.' },
      { when: 'มะรืน', date: '12 ก.ย.' },
      { when: 'เสาร์', date: '13 ก.ย.' },
      { when: 'อาทิตย์', date: '14 ก.ย.' },
      { when: 'จันทร์', date: '15 ก.ย.' },
      { when: 'เลือกเอง', date: '＋' },
    ].map((t) => ({
      when: t.when,
      date: t.date,
      style: 'min-height:56px;border-radius:8px;display:flex;flex-direction:column;align-items:center;'
        + 'justify-content:center;border:1px solid #dfe3ec;background:#ffffff;color:#10131a;',
      pick: () => this.setState({ moving: null }),
    }));

    const cur = this.state.moving === null ? null : list[this.state.moving];

    return {
      legend,
      dows,
      cells,
      dayPosts,
      moveTargets,
      dayTitle: this.state.day + ' กันยายน',
      dayCount: list.length + ' โพสต์',
      moving: cur != null,
      movingWhat: cur ? cur.time + ' · ' + cur.caption : '',
      moveIcon: this.mask('<path d="M4 10h12M12 6l4 4-4 4"/>', '#3d4453', 15),
      warnIcon: this.mask('<circle cx="10" cy="10" r="7.2"/><path d="M10 9v4.4M10 6.6v.1"/>', '#8a6a00', 17),
      closeMove: () => this.setState({ moving: null }),
    };
  }
}
</script>
</body>
</html>
