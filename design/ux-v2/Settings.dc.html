<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body {
      margin: 0; background: #eff1f5; color: #10131a;
      font-family: Sarabun, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    button { font: inherit; cursor: pointer; }
    a { color: #3b3fd8; text-decoration: none; }
    a:hover { color: #2f33bd; }
    .hint { font-size: 12.5px; color: #626a7c; }
  </style>
</helmet>

<div style="width: 390px; height: 900px; background: #eff1f5; overflow: hidden; display: flex; flex-direction: column">

  <div style="min-height: 56px; background: #ffffff; border-bottom: 1px solid #dfe3ec; display: flex; align-items: center; gap: 8px; padding: 0 12px; flex: none">
    <button style="width: 44px; height: 44px; border-radius: 6px; border: 1px solid #dfe3ec; background: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="#3d4453" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"/></svg>
    </button>
    <span style="font-weight: 700; font-size: 15px; flex-grow: 1">ตั้งค่า</span>
  </div>

  <!-- ทางลัด — ของจริงเป็นหน้าเดียวยาว 683 บรรทัด 8 หมวด ไม่มี anchor สักอัน -->
  <div style="background: #ffffff; border-bottom: 1px solid #dfe3ec; padding: 8px 12px; flex: none; display: flex; gap: 6px; overflow-x: auto">
    <sc-for list="{{jump}}" as="j" hint-placeholder-count="6">
      <button onClick="{{ j.pick }}" style="{{j.style}}">{{j.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px">

    <sc-for list="{{sections}}" as="s" hint-placeholder-count="6">
      <div style="background: #ffffff; border: 1px solid {{s.line}}; border-radius: 10px; overflow: hidden">
        <button onClick="{{ s.toggle }}" style="width: 100%; min-height: 60px; padding: 10px 12px; display: flex; align-items: center; gap: 11px; text-align: left; background: {{s.headBg}}; border: none">
          <span style="{{s.iconStyle}}"></span>
          <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; line-height: 1.35">
            <span style="font-size: 14px; font-weight: 600">{{s.name}}</span>
            <span style="font-size: 12px; color: #626a7c">{{s.summary}}</span>
          </span>
          <span style="{{s.caretStyle}}"></span>
        </button>

        <sc-if value="{{s.open}}" hint-placeholder-val="{{ true }}">
          <div style="padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #dfe3ec">
            <div style="height: 2px"></div>
            <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
              <div style="min-height: 48px; border: 1px solid #dfe3ec; border-radius: 8px; padding: 8px 11px; display: flex; align-items: center; gap: 10px">
                <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0; line-height: 1.35">
                  <span style="font-size: 13.5px; font-weight: 600">{{r.title}}</span>
                  <span style="font-size: 12px; color: #626a7c">{{r.sub}}</span>
                </span>
                <span style="{{r.tagStyle}}">{{r.tag}}</span>
              </div>
            </sc-for>
            <button style="min-height: 44px; border-radius: 8px; border: 1px dashed #b9c0d0; background: #ffffff; font-size: 13px; color: #3d4453">{{s.addLabel}}</button>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <!-- ของที่ย้ายออกไปอยู่ตรงจุดที่ใช้จริง -->
    <div style="background: #f7f8fb; border: 1px dashed #dfe3ec; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #626a7c">ย้ายไปอยู่ตรงจุดที่ใช้แล้ว</span>
      <sc-for list="{{moved}}" as="m" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 9px; min-height: 40px">
          <span style="{{m.iconStyle}}"></span>
          <span style="font-size: 13px; flex-grow: 1">{{m.name}}</span>
          <span style="font-size: 12px; color: #3b3fd8; font-weight: 600">{{m.where}}</span>
        </div>
      </sc-for>
      <span class="hint">สองอย่างนี้ถูกใช้ตอนเขียนโพสต์ ไม่ใช่ตอนตั้งระบบ — เดิมฝังอยู่ท้ายหน้านี้ ต้องเลื่อนผ่าน 6 หมวดกว่าจะเจอ</span>
    </div>

    <div style="height: 12px"></div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"openSection":{"editor":"enum","options":["เพจ","เวลาประจำ","ทีมงาน","แจ้งเตือน","โควตา AI","บัญชี"],"default":"เวลาประจำ","section":"สาธิต"}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: props.openSection || 'เวลาประจำ' };
  }

  mask(inner, color, size) {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="black" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
    const s = size || 20;
    return 'width:' + s + 'px;height:' + s + 'px;flex:none;display:inline-block;background-color:' + color + ';'
      + "-webkit-mask:url('data:image/svg+xml;utf8," + encodeURIComponent(svg) + "') center/contain no-repeat;"
      + "mask:url('data:image/svg+xml;utf8," + encodeURIComponent(svg) + "') center/contain no-repeat;";
  }

  tag(text, kind) {
    const map = {
      ok: ['#e4f3ec', '#1f7a4d'],
      warn: ['#fbf3dd', '#8a6a00'],
      bad: ['#fdecea', '#b42318'],
      mute: ['#f7f8fb', '#626a7c'],
    };
    const c = map[kind] || map.mute;
    return {
      tag: text,
      tagStyle: 'display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;'
        + 'font-size:12px;font-weight:600;flex:none;background:' + c[0] + ';color:' + c[1] + ';',
    };
  }

  renderVals() {
    const defs = [
      {
        key: 'เพจ', name: 'เพจที่เชื่อมต่อ', summary: '2 เพจ · ตรวจล่าสุดเมื่อวาน',
        icon: '<path d="M10 2.5a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15z"/><path d="M2.7 8h14.6M2.7 12h14.6M10 2.6c-3 4.4-3 10.4 0 14.8M10 2.6c3 4.4 3 10.4 0 14.8"/>',
        addLabel: '＋ เชื่อมต่อเพจใหม่',
        rows: [
          Object.assign({ title: 'ร้านลุงหนวด', sub: 'เพจ Facebook' }, this.tag('ใช้ได้', 'ok')),
          Object.assign({ title: 'lung_nuad.cafe', sub: 'Instagram Professional' }, this.tag('ใช้ได้', 'ok')),
        ],
      },
      {
        key: 'เวลาประจำ', name: 'ตารางเวลาประจำ', summary: '4 ช่วง · ใช้เป็นค่าตั้งต้นตอนเขียนโพสต์',
        icon: '<circle cx="10" cy="10" r="7"/><path d="M10 6v4.5l3 1.6"/>',
        addLabel: '＋ เพิ่มช่วงเวลา',
        rows: [
          Object.assign({ title: 'ทุกวัน 09:00', sub: 'ช่วงเช้า' }, this.tag('เปิด', 'ok')),
          Object.assign({ title: 'ทุกวัน 12:30', sub: 'ช่วงพักเที่ยง' }, this.tag('เปิด', 'ok')),
          Object.assign({ title: 'ทุกวัน 17:00', sub: 'ช่วงเลิกงาน' }, this.tag('เปิด', 'ok')),
          Object.assign({ title: 'เสาร์ 11:00', sub: 'สุดสัปดาห์' }, this.tag('ปิดอยู่', 'mute')),
        ],
      },
      {
        key: 'ทีมงาน', name: 'ทีมงานและการอนุมัติ', summary: '3 คน · ต้องตรวจก่อนขึ้นเพจ',
        icon: '<circle cx="7.5" cy="7" r="3"/><path d="M2.5 16.5c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5"/><path d="M13.5 5.2a3 3 0 0 1 0 5.6M15 16.5c0-2.2-.9-3.6-2.2-4.4"/>',
        addLabel: '＋ เพิ่มคนในทีม',
        rows: [
          Object.assign({ title: 'เจ้าของร้าน', sub: 'owner@example.com' }, this.tag('อนุมัติได้', 'ok')),
          Object.assign({ title: 'น้องแอดมิน', sub: 'admin@example.com' }, this.tag('เขียนได้', 'mute')),
        ],
      },
      {
        key: 'แจ้งเตือน', name: 'แจ้งเตือนเข้า LINE', summary: '1 ช่องทาง · เตือนเฉพาะเรื่องหนัก',
        icon: '<path d="M10 3a4.5 4.5 0 0 0-4.5 4.5c0 3.5-1.5 4.5-1.5 4.5h12s-1.5-1-1.5-4.5A4.5 4.5 0 0 0 10 3z"/><path d="M8.5 15a1.75 1.75 0 0 0 3 0"/>',
        addLabel: '＋ เพิ่มช่องทาง',
        rows: [
          Object.assign({ title: 'LINE เจ้าของร้าน', sub: 'ทดสอบล่าสุด 5 ก.ย. ผ่าน' }, this.tag('ใช้ได้', 'ok')),
        ],
      },
      {
        key: 'โควตา AI', name: 'โควตา AI เดือนนี้', summary: 'ภาพ 12/60 ใบ · 0.48 / 5 USD',
        icon: '<path d="M10 2.6l1.9 4.2 4.6.5-3.4 3.1.9 4.5L10 12.7 6 14.9l.9-4.5L3.5 7.3l4.6-.5z"/>',
        addLabel: 'ดูประวัติการใช้',
        rows: [
          Object.assign({ title: 'ภาพที่สร้างด้วย AI', sub: 'เพดาน 60 ใบต่อเดือน' }, this.tag('12 ใบ', 'mute')),
          Object.assign({ title: 'ร่างแคปชั่น', sub: 'เพดาน 300 ครั้งต่อเดือน' }, this.tag('47 ครั้ง', 'mute')),
          Object.assign({ title: 'ค่าใช้จ่ายสะสม', sub: 'หยุดอัตโนมัติเมื่อถึงเพดาน' }, this.tag('0.48 USD', 'ok')),
        ],
      },
      {
        key: 'บัญชี', name: 'บัญชีของฉัน', summary: 'owner@example.com',
        icon: '<circle cx="10" cy="7" r="3.2"/><path d="M3.5 17c0-3.2 2.9-5.2 6.5-5.2s6.5 2 6.5 5.2"/>',
        addLabel: 'เปลี่ยนรหัสผ่าน',
        rows: [
          Object.assign({ title: 'อีเมล', sub: 'owner@example.com' }, this.tag('เจ้าของ', 'ok')),
        ],
      },
    ];

    const sections = defs.map((d) => {
      const open = d.key === this.state.open;
      return {
        name: d.name,
        summary: d.summary,
        rows: d.rows,
        addLabel: d.addLabel,
        open,
        line: open ? '#cfd4fb' : '#dfe3ec',
        headBg: open ? '#eceffe' : '#ffffff',
        iconStyle: this.mask(d.icon, open ? '#3b3fd8' : '#626a7c', 21),
        caretStyle: this.mask(
          open ? '<path d="M5 12.5l5-5 5 5"/>' : '<path d="M5 7.5l5 5 5-5"/>',
          '#626a7c', 18),
        toggle: () => this.setState({ open: open ? '' : d.key }),
      };
    });

    const jump = defs.map((d) => {
      const on = d.key === this.state.open;
      return {
        label: d.key,
        style: 'min-height:40px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:600;flex:none;'
          + 'border:1px solid ' + (on ? '#3b3fd8' : '#dfe3ec') + ';'
          + 'background:' + (on ? '#eceffe' : '#ffffff') + ';'
          + 'color:' + (on ? '#3b3fd8' : '#3d4453') + ';',
        pick: () => this.setState({ open: d.key }),
      };
    });

    const moved = [
      { name: 'ชุดแฮชแท็ก', where: 'หน้าเขียนโพสต์',
        icon: '<path d="M3 3h6l8 8-6 6-8-8z"/><circle cx="7" cy="7" r="1.1"/>' },
      { name: 'โทนเสียงของเพจ', where: 'ปุ่มให้ AI ช่วยร่าง',
        icon: '<path d="M4 12.5V8a6 6 0 0 1 12 0v4.5"/><rect x="2.5" y="11" width="3.5" height="5" rx="1.5"/><rect x="14" y="11" width="3.5" height="5" rx="1.5"/>' },
    ].map((m) => ({
      name: m.name,
      where: m.where,
      iconStyle: this.mask(m.icon, '#626a7c', 18),
    }));

    return { sections, jump, moved };
  }
}
</script>
</body>
</html>
